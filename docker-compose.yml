services:
  api:
    build: .
    container_name: devops-api
    ports:
      - "8000:8000"

  nginx:
    build: ./nginx
    container_name: devops-nginx
    ports:
      - "80:80"
    depends_on:
      - api

  jenkins:
    build: ./jenkins
    container_name: devops-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home: